<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pocket Casts Starred · David Liu</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #06080d;
      --panel: #0b1020;
      --line: rgba(0, 217, 255, 0.24);
      --text: #eaf8ff;
      --muted: #95a8bf;
      --link: #00d9ff;
      --accent: #7b61ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 14px/1.5 Inter, "Segoe UI", system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      background:
        radial-gradient(1100px 620px at 18% -10%, rgba(123, 97, 255, 0.2), transparent 64%),
        radial-gradient(900px 540px at 88% 6%, rgba(0, 217, 255, 0.1), transparent 70%),
        linear-gradient(180deg, #04060b 0%, #070b15 48%, #06080d 100%);
      color: var(--text);
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 34px 34px;
      mask-image: radial-gradient(125% 90% at 50% -10%, black 35%, transparent 85%);
      opacity: 0.26;
      z-index: 0;
    }
    body::after {
      content: "";
      position: fixed;
      inset: -20% -10% auto;
      height: 70vh;
      pointer-events: none;
      background:
        radial-gradient(circle at 15% 28%, rgba(123, 97, 255, 0.2), transparent 42%),
        radial-gradient(circle at 80% 6%, rgba(0, 217, 255, 0.14), transparent 36%);
      filter: blur(26px);
      opacity: 0.6;
      z-index: 0;
    }
    .wrap {
      width: min(1100px, 96vw);
      margin: 28px auto 44px;
      position: relative;
      z-index: 1;
    }
    .hero {
      border: 1px solid var(--line);
      background: linear-gradient(160deg, rgba(123, 97, 255, 0.12), rgba(0, 0, 0, 0.36));
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 16px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: clamp(20px, 2.2vw, 30px);
    }
    .meta {
      color: var(--muted);
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
    }
    .meta a { color: var(--link); }
    .list {
      border: 1px solid var(--line);
      background: color-mix(in oklab, var(--panel) 86%, black);
      border-radius: 18px;
      overflow: hidden;
    }
    .row {
      display: grid;
      grid-template-columns: minmax(320px, 1fr) 220px 94px 120px;
      gap: 10px;
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      align-items: center;
    }
    .row:last-child { border-bottom: 0; }
    .title {
      margin: 0;
      font-weight: 650;
      color: var(--text);
      text-decoration: none;
    }
    .title:hover { color: var(--link); }
    .podcast, .date, .duration {
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .empty {
      padding: 22px 16px;
      color: var(--muted);
    }
    @media (max-width: 900px) {
      .row {
        grid-template-columns: 1fr;
        gap: 6px;
      }
      .podcast, .date, .duration { white-space: normal; }
    }
  </style>
</head>
<body>
<div data-ph-last-updated style="position:fixed;top:8px;left:8px;z-index:2147483647;background:rgba(17,17,17,.74);color:#fff;font:600 11px/1.4 'Segoe UI',Arial,sans-serif;padding:4px 9px;border-radius:7px;pointer-events:none;letter-spacing:.01em;box-shadow:0 2px 8px rgba(0,0,0,.25)">Last updated: November 23, 2026</div>

  <main class="wrap">
    <section class="hero">
      <h1>David Liu’s Pocket Casts Starred episodes</h1>
      <div class="meta" id="meta">Loading…</div>
    </section>
    <section class="list" id="list"></section>
  </main>
  <script>
    const meta = document.getElementById("meta");
    const list = document.getElementById("list");

    function normalizeDuration(rawDuration) {
      const value = (rawDuration || "").trim();
      if (!value) return "";
      const unwrapMergedDayDuration = (num, unit) => {
        const text = String(num);
        const candidates = [];
        for (const suffixLength of [2, 1]) {
          if (text.length <= suffixLength) continue;
          const day = Number.parseInt(text.slice(0, -suffixLength), 10);
          const duration = Number.parseInt(text.slice(-suffixLength), 10);
          if (day >= 1 && day <= 31 && duration >= 1 && duration <= 60) {
            candidates.push({ day, duration, suffixLength });
          }
        }
        if (!candidates.length) return num;
        if (/^sec/i.test(unit)) {
          const twoDigit = candidates.find(c => c.suffixLength === 2);
          return twoDigit ? twoDigit.duration : candidates[0].duration;
        }
        candidates.sort((a, b) => b.day - a.day);
        return candidates[0].duration;
      };
      const secs = value.match(/^(\d+)\s*sec(?:s)?$/i);
      if (secs) {
        const normalizedSecs = unwrapMergedDayDuration(Number(secs[1]), "secs");
        const mins = Math.max(1, Math.round(normalizedSecs / 60));
        return `${mins} min${mins === 1 ? "" : "s"}`;
      }
      const mins = value.match(/^(\d+)\s*min(?:s)?$/i);
      if (mins) {
        const total = unwrapMergedDayDuration(Number(mins[1]), "mins");
        return `${total} min${total === 1 ? "" : "s"}`;
      }
      const hours = value.match(/^(\d+)\s*(?:hr|hrs|hour|hours)$/i);
      if (hours) {
        const total = Number(hours[1]) * 60;
        return `${total} mins`;
      }
      return value;
    }

    function renderItem(item) {
      const row = document.createElement("article");
      row.className = "row";
      const title = document.createElement(item.episodeUrl ? "a" : "p");
      title.className = "title";
      title.textContent = item.title || "Untitled";
      if (item.episodeUrl) {
        title.href = item.episodeUrl;
        title.target = "_blank";
        title.rel = "noopener";
      } else {
        title.style.margin = "0";
      }
      const podcast = document.createElement("div");
      podcast.className = "podcast";
      podcast.textContent = item.podcast || "Unknown show";
      const date = document.createElement("div");
      date.className = "date";
      date.textContent = item.starredDate || item.publishedLabel || "";
      const duration = document.createElement("div");
      duration.className = "duration";
      duration.textContent = normalizeDuration(item.duration);
      row.appendChild(title);
      row.appendChild(podcast);
      row.appendChild(date);
      row.appendChild(duration);
      return row;
    }

    async function init() {
      try {
        const response = await fetch("data/pocketcasts-starred.json?ts=" + Date.now(), { cache: "no-store" });
        if (!response.ok) throw new Error("HTTP " + response.status);
        const payload = await response.json();
        const count = Number.isFinite(payload.total) ? payload.total : 0;
        const updated = payload.generatedDisplay || "Unknown";
        const source = payload.profileUrl || "https://pocketcasts.com/starred";
        meta.innerHTML = `<span>${count} episodes</span><span>Updated ${updated}</span><a href="${source}" target="_blank" rel="noopener">Open Pocket Casts starred</a>`;
        if (!Array.isArray(payload.items) || payload.items.length === 0) {
          list.innerHTML = '<div class="empty">No starred episodes have been published yet. Run the sync automation to populate this page.</div>';
          return;
        }
        payload.items.forEach(item => list.appendChild(renderItem(item)));
      } catch (error) {
        meta.textContent = "Could not load Pocket Casts Starred feed.";
        list.innerHTML = `<div class="empty">Feed load failed: ${error.message}</div>`;
      }
    }

    init();
  </script>
</body>
</html>
