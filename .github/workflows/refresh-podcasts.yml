name: Refresh podcast cards

on:
  schedule:
    # GitHub cron is UTC and can start late, so run both DST/standard slots.
    # The refresh is idempotent; the second run exits with no changes.
    - cron: '5 12,13 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [personal-hub-refresh]

permissions:
  contents: write

concurrency:
  group: personal-hub-podcast-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install playlist reader
        run: python -m pip install --disable-pip-version-check --upgrade yt-dlp

      - name: Refresh podcast cards
        run: python scripts/refresh_podcasts.py

      - name: Commit and push changes
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No podcast changes found.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html
          git commit -m "Daily podcast refresh $(date -u +%F)"
          git push origin HEAD:main
