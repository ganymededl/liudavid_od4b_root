name: Refresh podcast cards

on:
  schedule:
    # GitHub cron is UTC and can start late, so run both DST/standard slots.
    # The refresh is idempotent; the second run exits with no changes.
    - cron: '5 12,13 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [personal-hub-refresh]

permissions: {}

concurrency:
  group: personal-hub-podcast-refresh
  cancel-in-progress: false

jobs:
  extract:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install playlist reader
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          --only-binary=:all: -r scripts/requirements-podcasts.txt

      - name: Extract podcast metadata
        run: python scripts/refresh_podcasts.py --output podcast-output/metadata.json

      - name: Upload data only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: podcast-metadata
          path: podcast-output/metadata.json
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: extract
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out current trusted main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python without playlist dependencies
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Download this run's bounded archive without extraction
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -I -S scripts/podcast_artifact.py

      - name: Validate metadata and refresh approved fields
        timeout-minutes: 1
        env:
          METADATA_ARCHIVE: ${{ runner.temp }}/podcast-metadata.zip
        run: python -I -S scripts/publish_podcasts.py --metadata-archive "$METADATA_ARCHIVE"

      - name: Commit and push changes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo 'No podcast changes found.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html
          git commit --only -m "Daily podcast refresh $(date -u +%F)" -- index.html

          # Supply credentials only to this push, never to the checkout or validator.
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git push origin HEAD:refs/heads/main
