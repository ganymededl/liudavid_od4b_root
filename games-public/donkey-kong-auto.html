<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Donkey Kong &mdash; Auto-Play</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    color: #fff;
    font-family: "Courier New", monospace;
    height: 100%;
    overflow: hidden;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    user-select: none;
  }
  #wrap { position: relative; width: 480px; }
  canvas {
    display: block;
    border: 2px solid #444;
    background: #000;
    image-rendering: pixelated;
  }
  #hint {
    margin-top: 10px;
    color: #888;
    font-size: 12px;
    text-align: center;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="480" height="480"></canvas>
</div>
<div id="hint">AUTO-PLAY DEMO &middot; Jumpman navigates the girders on his own</div>
<script>
"use strict";
/* =====================================================================
   TUNING CONSTANTS
   GRAVITY              : downward acceleration per frame when airborne
   JUMP_VELOCITY        : initial upward velocity when jumping (negative)
   TERMINAL_VY          : max downward fall speed
   PLATFORM_SNAP        : px tolerance for "on platform" detection
   MOVE_SPEED           : horizontal px per frame
   CLIMB_SPEED          : vertical ladder climb px per frame
   BARREL_SPEED_BASE    : starting barrel horizontal speed
   BARREL_SPEED_INC     : barrel speed added per completed level
   BARREL_SPAWN_INTERVAL: frames between barrel spawns
   COLLISION_DIST       : center-to-center distance for player/barrel hit
   LADDER_GRAB_DIST     : horizontal px from ladder center to grab
   BARREL_LADDER_PROB   : per-frame chance barrel descends a ladder
   AI_JUMP_TRIGGER_DIST : px ahead the AI starts jumping a barrel
   AI_JUMP_MIN_DIST     : minimum distance so jump triggers at good timing
   AI_LEVEL_BAND        : vertical distance considered "same platform"
   ===================================================================== */
const GRAVITY = 0.5;
const JUMP_VELOCITY = -11;
const TERMINAL_VY = 10;
const PLATFORM_SNAP = 4;
const MOVE_SPEED = 3;
const CLIMB_SPEED = 2;
const BARREL_SPEED_BASE = 2;
const BARREL_SPEED_INC = 0.2;
const BARREL_SPAWN_INTERVAL = 180;
const COLLISION_DIST = 28;
const LADDER_GRAB_DIST = 10;
const BARREL_LADDER_PROB = 0.025;
const AI_JUMP_TRIGGER_DIST = 46;
const AI_JUMP_MIN_DIST = 18;
const AI_LEVEL_BAND = 32;
const CANVAS_W = 480;
const CANVAS_H = 480;
const HUD_H = 40;

/* ---------- Static level layout ---------- */
const PLATFORMS = [
  { x: 0, y: 120, w: 480, h: 12 },
  { x: 0, y: 250, w: 480, h: 12 },
  { x: 0, y: 390, w: 480, h: 12 }
];

const LADDERS = [
  { x: 120, top: 120, bottom: 250 },
  { x: 340, top: 120, bottom: 250 },
  { x: 80,  top: 250, bottom: 390 },
  { x: 260, top: 250, bottom: 390 },
  { x: 420, top: 250, bottom: 390 }
];

const PLAYER_W = 16;
const PLAYER_H = 24;
const BARREL_R = 10;
const PAULINE_X = 420;

/* ---------- Canvas ---------- */
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

/* ---------- Audio ---------- */
let audioCtx = null;
try {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (AC) audioCtx = new AC();
} catch (e) { audioCtx = null; }
function playTone(freq, duration, type, vol, sweepTo, delay) {
  if (!audioCtx) return;
  try {
    const start = audioCtx.currentTime + (delay || 0);
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || "square";
    osc.frequency.setValueAtTime(freq, start);
    if (typeof sweepTo === "number") {
      osc.frequency.linearRampToValueAtTime(sweepTo, start + duration);
    }
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.exponentialRampToValueAtTime(vol, start + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(start);
    osc.stop(start + duration + 0.02);
  } catch (e) {}
}
function playNoise(duration, vol, filterFreq, delay) {
  if (!audioCtx) return;
  try {
    const start = audioCtx.currentTime + (delay || 0);
    const bufSize = Math.max(1, Math.floor(audioCtx.sampleRate * duration));
    const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufSize);
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    const filt = audioCtx.createBiquadFilter();
    filt.type = "lowpass";
    filt.frequency.value = filterFreq || 1200;
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(vol, start);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
    src.connect(filt);
    filt.connect(gain);
    gain.connect(audioCtx.destination);
    src.start(start);
    src.stop(start + duration + 0.02);
  } catch (e) {}
}

function sfxJump() { playTone(540, 0.10, "square", 0.08, 900); }
function sfxHit()  {
  playTone(180, 0.18, "sawtooth", 0.15, 60);
  playNoise(0.25, 0.12, 400);
}
function sfxScore() {
  playTone(620, 0.07, "square", 0.08);
  playTone(880, 0.07, "square", 0.08, null, 0.07);
  playTone(1180, 0.10, "square", 0.08, null, 0.14);
}
function sfxFootstep() { playNoise(0.04, 0.04, 2400); }
function sfxClimb()    { playTone(320, 0.04, "square", 0.03, 360); }
function sfxPound()    {
  playTone(110, 0.12, "sine", 0.18, 50);
  playNoise(0.14, 0.10, 300);
}

// "All rounds clear"-style victory fanfare, fully synthesized.
// Ascending C-major arpeggio into a triumphant trill and flourish.
function sfxLevelClear() {
  if (!audioCtx) return;
  // Notes in Hz (C major): C5, E5, G5, C6, E6, G6, C7
  const NOTES = [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98, 2093.00];
  let t = 0;
  const step = 0.12;
  // Rising arpeggio
  for (let i = 0; i < NOTES.length; i++) {
    playTone(NOTES[i], 0.14, "square", 0.09, null, t);
    playTone(NOTES[i] / 2, 0.14, "triangle", 0.05, null, t);
    t += step;
  }
  // Trill between G6 and C7
  for (let k = 0; k < 6; k++) {
    playTone(k % 2 === 0 ? 1567.98 : 2093.00, 0.07, "square", 0.08, null, t);
    t += 0.07;
  }
  // Final long triumphant chord
  playTone(1046.50, 0.55, "square",   0.09, null, t); // C6
  playTone(1318.51, 0.55, "square",   0.08, null, t); // E6
  playTone(1567.98, 0.55, "square",   0.08, null, t); // G6
  playTone(523.25,  0.55, "triangle", 0.07, null, t); // C5 bass
  // Sparkle on top
  playTone(2637.02, 0.35, "square", 0.05, null, t + 0.18); // E7
  playTone(3135.96, 0.35, "square", 0.05, null, t + 0.28); // G7
}

function sfxDeath() {
  if (!audioCtx) return;
  // Descending "bwaaaa" tumble
  playTone(440, 0.18, "sawtooth", 0.12, 330);
  playTone(330, 0.22, "sawtooth", 0.12, 220, 0.16);
  playTone(220, 0.30, "sawtooth", 0.14, 110, 0.36);
  playNoise(0.3, 0.10, 500, 0.5);
}

function sfxGameOver() {
  if (!audioCtx) return;
  // Two descending minor phrases
  const NOTES = [523.25, 466.16, 415.30, 349.23, 311.13, 261.63, 233.08, 196.00];
  let t = 0;
  for (let i = 0; i < NOTES.length; i++) {
    playTone(NOTES[i], 0.18, "triangle", 0.08, null, t);
    playTone(NOTES[i] / 2, 0.18, "square", 0.05, null, t);
    t += 0.15;
  }
}

// Light "marching" percussion while playing — ticks in sync with DK pound
function sfxMarchTick(highBeat) {
  if (!audioCtx) return;
  playNoise(0.05, highBeat ? 0.045 : 0.025, highBeat ? 3000 : 1500);
}

// Try to resume audio on first click anywhere
window.addEventListener("click", function(){
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume().catch(function(){});
});
window.addEventListener("keydown", function(){
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume().catch(function(){});
});

/* ---------- Simulated input (driven by AI) ---------- */
const simKeys = {
  ArrowLeft: false,
  ArrowRight: false,
  ArrowUp: false,
  ArrowDown: false,
  Space: false
};
function clearSimKeys() {
  simKeys.ArrowLeft = false;
  simKeys.ArrowRight = false;
  simKeys.ArrowUp = false;
  simKeys.ArrowDown = false;
  simKeys.Space = false;
}

/* ---------- Game state ---------- */
let gameState;
let autoRestartTimer = 0;

function createPlayer() {
  return {
    x: 24,
    y: PLATFORMS[2].y - PLAYER_H,
    vx: 0,
    vy: 0,
    w: PLAYER_W,
    h: PLAYER_H,
    onGround: true,
    onLadder: false,
    facing: 1,
    flashFrames: 0
  };
}

function initGame() {
  gameState = {
    player: createPlayer(),
    barrels: [],
    score: 0,
    lives: 3,
    level: 1,
    phase: "playing",
    spawnTimer: 0,
    dkFrame: 0,
    deathTimer: 0,
    aiGoalLadder: null,
    aiJumpCooldown: 0
  };
  autoRestartTimer = 0;
}

function nextLevel() {
  gameState.player = createPlayer();
  gameState.barrels = [];
  gameState.spawnTimer = 0;
  gameState.level += 1;
  gameState.phase = "playing";
  gameState.aiGoalLadder = null;
  autoRestartTimer = 0;
}

/* ---------- Helpers ---------- */
function ladderAt(centerX, bottomY) {
  for (let i = 0; i < LADDERS.length; i++) {
    const l = LADDERS[i];
    if (Math.abs(centerX - l.x) <= LADDER_GRAB_DIST) {
      if (bottomY >= l.top - 2 && bottomY <= l.bottom + 2) return l;
    }
  }
  return null;
}
function ladderStartingHere(centerX, bottomY) {
  for (let i = 0; i < LADDERS.length; i++) {
    const l = LADDERS[i];
    if (Math.abs(centerX - l.x) <= LADDER_GRAB_DIST) {
      if (Math.abs(bottomY - l.top) <= PLATFORM_SNAP + 2) return l;
    }
  }
  return null;
}
function platformUnder(x, w, bottomY, vy) {
  if (vy < 0) return null;
  for (let i = 0; i < PLATFORMS.length; i++) {
    const p = PLATFORMS[i];
    if (x + w > p.x && x < p.x + p.w) {
      if (bottomY >= p.y - PLATFORM_SNAP && bottomY <= p.y + PLATFORM_SNAP + Math.max(0, vy)) return p;
    }
  }
  return null;
}
function stillOnAnyPlatform(x, w, bottomY) {
  for (let i = 0; i < PLATFORMS.length; i++) {
    const p = PLATFORMS[i];
    if (x + w > p.x && x < p.x + p.w) {
      if (Math.abs(bottomY - p.y) <= PLATFORM_SNAP) return true;
    }
  }
  return false;
}
function currentPlatformIndex(p) {
  const bottom = p.y + p.h;
  for (let i = 0; i < PLATFORMS.length; i++) {
    if (Math.abs(bottom - PLATFORMS[i].y) <= PLATFORM_SNAP + 1) {
      if (p.x + p.w > PLATFORMS[i].x && p.x < PLATFORMS[i].x + PLATFORMS[i].w) return i;
    }
  }
  return -1;
}

/* ---------- AI ---------- */
function aiDecide() {
  clearSimKeys();
  const p = gameState.player;
  if (gameState.aiJumpCooldown > 0) gameState.aiJumpCooldown -= 1;

  // On ladder: keep going up, unless already at top of ladder zone
  if (p.onLadder) {
    simKeys.ArrowUp = true;
    return;
  }

  // Airborne: maintain horizontal direction toward goal (momentum already carries)
  const pcx = p.x + p.w / 2;

  const pIdx = currentPlatformIndex(p);

  // Top platform: head to Pauline
  if (pIdx === 0) {
    if (p.x + p.w < PAULINE_X - 4) {
      simKeys.ArrowRight = true;
      p.facing = 1;
    }
    maybeJumpBarrel(p);
    return;
  }

  // Find the best upward ladder from this platform
  let goal = gameState.aiGoalLadder;
  const curPlat = pIdx >= 0 ? PLATFORMS[pIdx] : null;
  const validGoal = goal && curPlat && Math.abs(goal.bottom - curPlat.y) < 2;
  if (!validGoal) goal = pickUpLadder(p, pIdx);
  gameState.aiGoalLadder = goal;

  if (!goal) {
    // Airborne or between states: nudge toward center
    if (pcx < CANVAS_W / 2) simKeys.ArrowRight = true; else simKeys.ArrowLeft = true;
    maybeJumpBarrel(p);
    return;
  }

  // Walk toward the ladder. Grab as soon as close enough.
  if (Math.abs(pcx - goal.x) <= MOVE_SPEED + 1) {
    simKeys.ArrowUp = true; // triggers ladder grab in player update
  } else if (pcx < goal.x) {
    simKeys.ArrowRight = true;
    p.facing = 1;
  } else {
    simKeys.ArrowLeft = true;
    p.facing = -1;
  }

  maybeJumpBarrel(p);
}

function pickUpLadder(p, pIdx) {
  if (pIdx < 0) return null;
  const curPlat = PLATFORMS[pIdx];
  const pcx = p.x + p.w / 2;
  const ups = [];
  for (let i = 0; i < LADDERS.length; i++) {
    const l = LADDERS[i];
    if (Math.abs(l.bottom - curPlat.y) < 2) ups.push(l);
  }
  if (ups.length === 0) return null;

  // Score each ladder: prefer nearer, but avoid ones with an incoming barrel nearby
  let best = ups[0];
  let bestScore = -Infinity;
  for (let i = 0; i < ups.length; i++) {
    const l = ups[i];
    let score = -Math.abs(pcx - l.x);
    // Penalize ladders with barrels nearby (within 60px) on same platform
    for (let j = 0; j < gameState.barrels.length; j++) {
      const b = gameState.barrels[j];
      const bcy = b.y + b.r;
      if (Math.abs(bcy - curPlat.y) < AI_LEVEL_BAND) {
        const bd = Math.abs((b.x + b.r) - l.x);
        if (bd < 60) score -= 120;
      }
    }
    if (score > bestScore) { bestScore = score; best = l; }
  }
  return best;
}

function maybeJumpBarrel(p) {
  if (!p.onGround || gameState.aiJumpCooldown > 0) return;
  const pcx = p.x + p.w / 2;
  const pcy = p.y + p.h / 2;
  for (let i = 0; i < gameState.barrels.length; i++) {
    const b = gameState.barrels[i];
    if (b.onLadder) continue;
    const bcx = b.x + b.r;
    const bcy = b.y + b.r;
    if (Math.abs(bcy - pcy) > AI_LEVEL_BAND) continue;

    const dx = bcx - pcx; // +ve = barrel to the right of player
    const approaching =
      (b.vx > 0 && dx > 0 && dx < AI_JUMP_TRIGGER_DIST) ||
      (b.vx < 0 && dx < 0 && -dx < AI_JUMP_TRIGGER_DIST) ||
      // stationary-ish barrel right next to us
      (Math.abs(b.vx) < 0.5 && Math.abs(dx) < AI_JUMP_TRIGGER_DIST);
    if (approaching && Math.abs(dx) >= AI_JUMP_MIN_DIST && Math.abs(dx) <= AI_JUMP_TRIGGER_DIST) {
      simKeys.Space = true;
      gameState.aiJumpCooldown = 15;
      return;
    }
  }
}

/* ---------- Barrels ---------- */
function spawnBarrel() {
  const speed = BARREL_SPEED_BASE + BARREL_SPEED_INC * (gameState.level - 1);
  gameState.barrels.push({
    x: 96,
    y: PLATFORMS[0].y - BARREL_R * 2,
    vx: speed,
    vy: 0,
    r: BARREL_R,
    onGround: true,
    onLadder: false,
    ladderBottom: 0,
    rotation: 0,
    scored: false,
    ladderCooldown: 0
  });
}

function updateBarrels() {
  const curSpeed = BARREL_SPEED_BASE + BARREL_SPEED_INC * (gameState.level - 1);

  for (let i = gameState.barrels.length - 1; i >= 0; i--) {
    const b = gameState.barrels[i];
    if (b.ladderCooldown > 0) b.ladderCooldown--;

    if (b.onLadder) {
      b.y += curSpeed;
      b.rotation += 0.15;
      if (b.y + b.r * 2 >= b.ladderBottom) {
        b.y = b.ladderBottom - b.r * 2;
        b.onLadder = false;
        b.onGround = true;
        b.vy = 0;
        b.vx = (Math.random() < 0.5 ? -1 : 1) * curSpeed;
        b.ladderCooldown = 30;
      }
    } else {
      if (!b.onGround) {
        b.vy += GRAVITY;
        if (b.vy > TERMINAL_VY) b.vy = TERMINAL_VY;
      }
      b.x += b.vx;
      b.y += b.vy;
      b.rotation += b.vx * 0.06;

      const bottomY = b.y + b.r * 2;
      const plat = platformUnder(b.x, b.r * 2, bottomY, b.vy);
      if (plat && b.vy >= 0) {
        b.y = plat.y - b.r * 2;
        b.vy = 0;
        b.onGround = true;
      } else if (b.onGround) {
        if (!stillOnAnyPlatform(b.x, b.r * 2, bottomY)) b.onGround = false;
      }

      if (b.x < 0)                   { b.x = 0;                   b.vx = Math.abs(b.vx); }
      if (b.x + b.r * 2 > CANVAS_W)  { b.x = CANVAS_W - b.r * 2;  b.vx = -Math.abs(b.vx); }

      if (b.onGround && b.ladderCooldown === 0) {
        const centerX = b.x + b.r;
        const bottom = b.y + b.r * 2;
        for (let k = 0; k < LADDERS.length; k++) {
          const l = LADDERS[k];
          if (Math.abs(centerX - l.x) <= LADDER_GRAB_DIST &&
              Math.abs(bottom - l.top) <= PLATFORM_SNAP + 2) {
            if (Math.random() < BARREL_LADDER_PROB) {
              b.onLadder = true;
              b.ladderBottom = l.bottom;
              b.x = l.x - b.r;
              b.vx = 0;
              b.vy = 0;
              b.onGround = false;
            }
            break;
          }
        }
      }
    }

    if (b.y > CANVAS_H + 40 || b.x < -40 || b.x > CANVAS_W + 40) {
      gameState.barrels.splice(i, 1);
      continue;
    }

    const p = gameState.player;
    const bcx = b.x + b.r;
    const bcy = b.y + b.r;
    const pcx = p.x + p.w / 2;
    const pcy = p.y + p.h / 2;

    if (!b.scored && !p.onGround && !p.onLadder) {
      const feet = p.y + p.h;
      if (feet <= bcy && Math.abs(pcx - bcx) < 24) {
        b.scored = true;
        gameState.score += 100;
        sfxScore();
      }
    }
    if (Math.hypot(bcx - pcx, bcy - pcy) < COLLISION_DIST &&
        gameState.phase === "playing" && p.flashFrames === 0) {
      loseLife();
    }
  }
}

/* ---------- Player ---------- */
function updatePlayer() {
  const p = gameState.player;
  const centerX = p.x + p.w / 2;
  const bottomY = p.y + p.h;

  if (p.onLadder) {
    const l = ladderAt(centerX, bottomY);
    if (l) p.x = l.x - p.w / 2;
    p.vx = 0; p.vy = 0;

    if (simKeys.ArrowUp)   p.y -= CLIMB_SPEED;
    if (simKeys.ArrowDown) p.y += CLIMB_SPEED;

    const newBottom = p.y + p.h;

    if (l && newBottom <= l.top) {
      p.y = l.top - p.h;
      p.onLadder = false;
      p.onGround = true;
      if (p.x + p.w > 380 && Math.abs(p.y + p.h - PLATFORMS[0].y) < 2) gameWin();
      return;
    }
    if (l && newBottom >= l.bottom) {
      p.y = l.bottom - p.h;
      p.onLadder = false;
      p.onGround = true;
      return;
    }
    return;
  }

  if (p.onGround) {
    p.vx = 0;
    if (simKeys.ArrowLeft)  { p.vx = -MOVE_SPEED; p.facing = -1; }
    if (simKeys.ArrowRight) { p.vx =  MOVE_SPEED; p.facing =  1; }
  } else {
    if (simKeys.ArrowLeft)       { p.vx = -MOVE_SPEED; p.facing = -1; }
    else if (simKeys.ArrowRight) { p.vx =  MOVE_SPEED; p.facing =  1; }
  }

  if (p.onGround) {
    if (simKeys.ArrowUp) {
      const l = ladderAt(centerX, bottomY);
      if (l) {
        p.onLadder = true;
        p.x = l.x - p.w / 2;
        p.vx = 0; p.vy = 0;
        return;
      }
    } else if (simKeys.ArrowDown) {
      const l = ladderStartingHere(centerX, bottomY);
      if (l) {
        p.onLadder = true;
        p.x = l.x - p.w / 2;
        p.vx = 0; p.vy = 0;
        p.y += CLIMB_SPEED;
        p.onGround = false;
        return;
      }
    }
  }

  if ((simKeys.Space || simKeys.ArrowUp) && p.onGround && !p.onLadder) {
    // ArrowUp becomes jump only if there's no ladder here
    if (simKeys.ArrowUp && ladderAt(centerX, bottomY)) {
      // Already handled above; ignore
    } else {
      p.vy = JUMP_VELOCITY;
      p.onGround = false;
      sfxJump();
    }
  }

  if (!p.onGround) {
    p.vy += GRAVITY;
    if (p.vy > TERMINAL_VY) p.vy = TERMINAL_VY;
  }

  p.x += p.vx;
  p.y += p.vy;

  if (p.x < 0) p.x = 0;
  if (p.x + p.w > CANVAS_W) p.x = CANVAS_W - p.w;

  const newBottom = p.y + p.h;
  const plat = platformUnder(p.x, p.w, newBottom, p.vy);
  if (plat && p.vy >= 0) {
    p.y = plat.y - p.h;
    p.vy = 0;
    p.onGround = true;
    if (plat === PLATFORMS[0] && p.x + p.w > 380) gameWin();
  } else {
    if (p.onGround && !stillOnAnyPlatform(p.x, p.w, newBottom)) p.onGround = false;
  }

  if (p.y > CANVAS_H) loseLife();
}

/* ---------- Life / win ---------- */
function loseLife() {
  if (gameState.phase !== "playing") return;
  sfxHit();
  sfxDeath();
  gameState.lives -= 1;
  gameState.player.flashFrames = 30;
  if (gameState.lives <= 0) {
    gameState.phase = "gameover";
    autoRestartTimer = 240;
    sfxGameOver();
  } else {
    gameState.phase = "dead";
    gameState.deathTimer = 50;
  }
}
function gameWin() {
  if (gameState.phase !== "playing") return;
  gameState.phase = "win";
  gameState.score += 500;
  autoRestartTimer = 260;
  sfxLevelClear();
}

/* ---------- Main loop ---------- */
function update() {
  if (gameState.phase === "playing") {
    aiDecide();
    const prevDkFrame = gameState.dkFrame;
    const prevX = gameState.player.x;
    const prevY = gameState.player.y;
    const wasOnLadder = gameState.player.onLadder;

    updatePlayer();
    updateBarrels();
    gameState.spawnTimer += 1;
    if (gameState.spawnTimer >= BARREL_SPAWN_INTERVAL) {
      spawnBarrel();
      gameState.spawnTimer = 0;
    }
    gameState.dkFrame += 1;

    // DK pound boom on animation transition
    const prevPhase = Math.floor(prevDkFrame / 25) % 2;
    const curPhase = Math.floor(gameState.dkFrame / 25) % 2;
    if (prevPhase !== curPhase && curPhase === 1) sfxPound();

    // Marching tick every ~24 frames (alternating strong/weak beat)
    if (gameState.dkFrame % 24 === 0) {
      sfxMarchTick((gameState.dkFrame / 24) % 2 === 0);
    }

    // Footstep sfx while walking on ground
    const p = gameState.player;
    if (p.onGround && !p.onLadder && Math.abs(p.x - prevX) > 0.5 && gameState.dkFrame % 10 === 0) {
      sfxFootstep();
    }
    // Climb click while moving on ladder
    if (p.onLadder && Math.abs(p.y - prevY) > 0.5 && gameState.dkFrame % 12 === 0) {
      sfxClimb();
    }
    // Ladder-grab bleep
    if (!wasOnLadder && p.onLadder) sfxClimb();

    if (gameState.player.flashFrames > 0) gameState.player.flashFrames -= 1;
  } else if (gameState.phase === "dead") {
    if (gameState.player.flashFrames > 0) gameState.player.flashFrames -= 1;
    gameState.deathTimer -= 1;
    if (gameState.deathTimer <= 0) {
      gameState.player = createPlayer();
      gameState.barrels = [];
      gameState.spawnTimer = 0;
      gameState.phase = "playing";
      gameState.aiGoalLadder = null;
    }
  } else {
    // gameover or win — auto restart / advance
    if (autoRestartTimer > 0) {
      autoRestartTimer -= 1;
    } else {
      if (gameState.phase === "gameover") initGame();
      else if (gameState.phase === "win") nextLevel();
    }
  }
}

/* ---------- Rendering ---------- */
function render() {
  ctx.fillStyle = "#1a1a2e";
  ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

  // HUD
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, CANVAS_W, HUD_H);
  ctx.fillStyle = "#fff";
  ctx.font = "bold 14px 'Courier New', monospace";
  ctx.textAlign = "left";
  ctx.fillText("SCORE " + gameState.score, 10, 17);
  ctx.fillText("LEVEL " + gameState.level, 10, 33);
  ctx.textAlign = "center";
  ctx.fillStyle = "#2ecc71";
  ctx.fillText("\u25B6 AUTO-PLAY", CANVAS_W / 2, 25);
  ctx.fillStyle = "#fff";
  ctx.textAlign = "right";
  ctx.fillText("LIVES " + gameState.lives, CANVAS_W - 10, 25);
  ctx.fillStyle = "#444";
  ctx.fillRect(0, HUD_H - 2, CANVAS_W, 2);

  // Platforms
  for (let i = 0; i < PLATFORMS.length; i++) {
    const p = PLATFORMS[i];
    ctx.fillStyle = "#c0392b";
    ctx.fillRect(p.x, p.y, p.w, p.h);
    ctx.fillStyle = "#7a1f15";
    for (let rx = 8; rx < p.w - 4; rx += 20) {
      ctx.fillRect(p.x + rx, p.y + 2, 2, 2);
      ctx.fillRect(p.x + rx, p.y + p.h - 4, 2, 2);
    }
    ctx.fillStyle = "#e55b44";
    ctx.fillRect(p.x, p.y, p.w, 2);
  }

  // Ladders
  for (let i = 0; i < LADDERS.length; i++) {
    const l = LADDERS[i];
    ctx.strokeStyle = "#f1c40f";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(l.x - 8, l.top);
    ctx.lineTo(l.x - 8, l.bottom);
    ctx.moveTo(l.x + 8, l.top);
    ctx.lineTo(l.x + 8, l.bottom);
    ctx.stroke();
    for (let ry = l.top + 8; ry < l.bottom; ry += 10) {
      ctx.beginPath();
      ctx.moveTo(l.x - 8, ry);
      ctx.lineTo(l.x + 8, ry);
      ctx.stroke();
    }
  }

  // AI goal marker (subtle)
  if (gameState.aiGoalLadder && gameState.phase === "playing") {
    const l = gameState.aiGoalLadder;
    ctx.fillStyle = "rgba(46, 204, 113, 0.5)";
    ctx.fillRect(l.x - 2, l.top - 6, 4, 4);
  }

  drawDK(30, PLATFORMS[0].y);
  drawPauline(PAULINE_X, PLATFORMS[0].y);

  for (let i = 0; i < gameState.barrels.length; i++) drawBarrel(gameState.barrels[i]);
  drawPlayer(gameState.player);

  if (gameState.phase === "gameover") {
    drawOverlay();
    ctx.fillStyle = "#e74c3c";
    ctx.font = "bold 44px 'Courier New', monospace";
    ctx.textAlign = "center";
    ctx.fillText("GAME OVER", CANVAS_W / 2, CANVAS_H / 2 - 20);
    ctx.fillStyle = "#fff";
    ctx.font = "bold 16px 'Courier New', monospace";
    ctx.fillText("Score: " + gameState.score, CANVAS_W / 2, CANVAS_H / 2 + 12);
    ctx.fillStyle = "#bbb";
    ctx.font = "14px 'Courier New', monospace";
    ctx.fillText("Restarting in " + Math.ceil(autoRestartTimer / 60) + "s...", CANVAS_W / 2, CANVAS_H / 2 + 40);
  } else if (gameState.phase === "win") {
    drawOverlay();
    ctx.fillStyle = "#2ecc71";
    ctx.font = "bold 40px 'Courier New', monospace";
    ctx.textAlign = "center";
    ctx.fillText("PAULINE SAVED!", CANVAS_W / 2, CANVAS_H / 2 - 20);
    ctx.fillStyle = "#fff";
    ctx.font = "bold 16px 'Courier New', monospace";
    ctx.fillText("Level " + gameState.level + " cleared", CANVAS_W / 2, CANVAS_H / 2 + 12);
    ctx.fillStyle = "#bbb";
    ctx.font = "14px 'Courier New', monospace";
    ctx.fillText("Next level in " + Math.ceil(autoRestartTimer / 60) + "s...", CANVAS_W / 2, CANVAS_H / 2 + 40);
  }
}

function drawOverlay() {
  ctx.fillStyle = "rgba(0,0,0,0.72)";
  ctx.fillRect(0, HUD_H, CANVAS_W, CANVAS_H - HUD_H);
}

function drawDK(x, topPlatformY) {
  const f = gameState.dkFrame;
  const pound = Math.floor(f / 25) % 2 === 0 ? 0 : 3;
  const bodyH = 48;
  const by = topPlatformY - bodyH - pound;

  ctx.fillStyle = "#6b3410";
  roundRect(x, by + 14, 64, 36, 8, true, false);
  ctx.fillStyle = "#8b4513";
  roundRect(x + 10, by - 8, 44, 26, 8, true, false);
  ctx.fillStyle = "#d2a679";
  roundRect(x + 16, by + 2, 32, 14, 4, true, false);
  ctx.fillStyle = "#fff";
  ctx.fillRect(x + 20, by + 4, 6, 6);
  ctx.fillRect(x + 38, by + 4, 6, 6);
  ctx.fillStyle = "#000";
  ctx.fillRect(x + 22, by + 6, 3, 3);
  ctx.fillRect(x + 40, by + 6, 3, 3);
  ctx.fillStyle = "#3a1f08";
  ctx.fillRect(x + 28, by + 11, 8, 2);
  ctx.fillRect(x + 26, by + 14, 12, 2);

  const armY = by + 18 + (pound ? -6 : 2);
  ctx.fillStyle = "#6b3410";
  roundRect(x - 12, armY, 18, 16, 5, true, false);
  roundRect(x + 58, armY, 18, 16, 5, true, false);

  ctx.fillStyle = "#c49a72";
  roundRect(x + 18, by + 22, 28, 22, 4, true, false);

  ctx.fillStyle = "#6b3410";
  ctx.fillRect(x + 10, by + 46, 14, 6);
  ctx.fillRect(x + 40, by + 46, 14, 6);
}

function drawPauline(x, topPlatformY) {
  const by = topPlatformY - 32;
  ctx.fillStyle = "#ff6ec7";
  ctx.fillRect(x, by + 16, 18, 16);
  ctx.fillStyle = "#fff";
  ctx.fillRect(x, by + 30, 18, 2);
  ctx.fillStyle = "#ffd1a4";
  ctx.fillRect(x + 4, by + 4, 10, 10);
  ctx.fillStyle = "#8b0000";
  ctx.fillRect(x + 3, by + 1, 12, 4);
  ctx.fillRect(x + 2, by + 3, 3, 8);
  ctx.fillRect(x + 13, by + 3, 3, 8);
  ctx.fillStyle = "#000";
  ctx.fillRect(x + 7, by + 8, 2, 2);
  ctx.fillRect(x + 11, by + 8, 2, 2);

  if (Math.floor(gameState.dkFrame / 30) % 2 === 0 && gameState.phase === "playing") {
    ctx.fillStyle = "#fff";
    ctx.font = "bold 11px 'Courier New', monospace";
    ctx.textAlign = "center";
    ctx.fillText("HELP!", x + 9, by - 4);
  }
}

function drawPlayer(p) {
  const flashing = p.flashFrames > 0 && Math.floor(p.flashFrames / 4) % 2 === 0;
  const bodyColor = flashing ? "#ffffff" : "#e74c3c";
  const legColor  = flashing ? "#ffffff" : "#2980b9";
  const skinColor = flashing ? "#ffffff" : "#ffd1a4";

  ctx.fillStyle = legColor;
  ctx.fillRect(p.x + 2,         p.y + 17, 5, 7);
  ctx.fillRect(p.x + p.w - 7,   p.y + 17, 5, 7);
  ctx.fillStyle = flashing ? "#ffffff" : "#2c1608";
  ctx.fillRect(p.x + 1,         p.y + 22, 6, 2);
  ctx.fillRect(p.x + p.w - 7,   p.y + 22, 6, 2);
  ctx.fillStyle = bodyColor;
  ctx.fillRect(p.x + 1, p.y + 9, p.w - 2, 9);
  ctx.fillStyle = skinColor;
  ctx.fillRect(p.x + 3, p.y + 3, p.w - 6, 7);
  ctx.fillStyle = flashing ? "#ffffff" : "#2c1608";
  ctx.fillRect(p.x + 3, p.y + 8, p.w - 6, 1);
  ctx.fillStyle = bodyColor;
  ctx.fillRect(p.x + 2, p.y,     p.w - 4, 3);
  if (p.facing > 0) ctx.fillRect(p.x + p.w - 4, p.y + 2, 5, 2);
  else              ctx.fillRect(p.x - 1,       p.y + 2, 5, 2);
  if (!flashing) {
    ctx.fillStyle = "#000";
    ctx.fillRect(p.x + (p.facing > 0 ? p.w - 6 : 3), p.y + 5, 2, 2);
  }
}

function drawBarrel(b) {
  const cx = b.x + b.r;
  const cy = b.y + b.r;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(b.rotation);
  ctx.fillStyle = "#5c2e0c";
  ctx.beginPath();
  ctx.arc(0, 0, b.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "#a86a33";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-b.r + 2, 0); ctx.lineTo(b.r - 2, 0);
  ctx.moveTo(0, -b.r + 2); ctx.lineTo(0, b.r - 2);
  ctx.stroke();
  ctx.strokeStyle = "#3a1f08";
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(0, 0, b.r - 2, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();
}

function roundRect(x, y, w, h, r, fill, stroke) {
  if (r > w / 2) r = w / 2;
  if (r > h / 2) r = h / 2;
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
  if (fill) ctx.fill();
  if (stroke) ctx.stroke();
}

function frame() {
  update();
  render();
  requestAnimationFrame(frame);
}

initGame();
frame();
</script>
</body>
