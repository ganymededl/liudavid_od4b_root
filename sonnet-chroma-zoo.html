<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sonnet Chroma Zoo</title>
<style>
:root {
  --bg: #070710;
  --fg: #f1efff;
  --muted: #a5a0cd;
  --accent: #ff63d6;
  --panel: rgba(16, 10, 24, 0.66);
}
html[data-theme="light"] {
  --bg: #faf7ff;
  --fg: #1f1833;
  --muted: #695f88;
  --accent: #b91c8f;
  --panel: rgba(255, 255, 255, 0.76);
}
* { box-sizing: border-box; }
body { margin: 0; overflow: hidden; background: var(--bg); color: var(--fg); font-family: "Segoe UI", Aptos, sans-serif; }
a { color: inherit; text-decoration: none; }
.hud {
  position: fixed; inset: 16px 16px auto 16px; z-index: 2;
  display: flex; justify-content: space-between; align-items: center; gap: 14px;
  border: 1px solid rgba(255,255,255,.15); border-radius: 12px; padding: 10px 12px;
  background: var(--panel); backdrop-filter: blur(8px);
}
.meta { font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.meta strong { color: var(--accent); font-weight: 600; }
label { font-size: 12px; color: var(--muted); }
input[type="range"] { accent-color: var(--accent); vertical-align: middle; width: 130px; }
canvas { width: 100vw; height: 100vh; display: block; }
</style>
</head>
<body>
<div class="hud">
  <div class="meta"><a href="artificial-gallery.html">Back to gallery</a> · <strong>Claude Sonnet 5.5</strong> · built 2026-10-29</div>
  <label>Wacky <input id="wacky" type="range" min="1" max="100" value="62"></label>
</div>
<canvas id="c"></canvas>
<script>
(() => {
  "use strict";
  const t = new URLSearchParams(location.search).get("scoutTheme");
  document.documentElement.dataset.theme = t === "light" ? "light" : "dark";

  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const agents = [];
  let w = 0, h = 0, tm = 0, wacky = 0.62;

  function reset() {
    agents.length = 0;
    const count = 80;
    for (let i = 0; i < count; i++) {
      agents.push({
        x: Math.random() * w,
        y: Math.random() * h,
        vx: (Math.random() - 0.5) * 2,
        vy: (Math.random() - 0.5) * 2,
        phase: Math.random() * Math.PI * 2,
        hue: i * (360 / count)
      });
    }
  }

  function resize() {
    const dpr = devicePixelRatio || 1;
    canvas.width = Math.floor(innerWidth * dpr);
    canvas.height = Math.floor(innerHeight * dpr);
    canvas.style.width = innerWidth + "px";
    canvas.style.height = innerHeight + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    w = innerWidth;
    h = innerHeight;
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--bg");
    ctx.fillRect(0, 0, w, h);
    reset();
  }

  function frame() {
    tm += 0.014;
    const fade = document.documentElement.dataset.theme === "light" ? 0.065 : 0.05;
    ctx.fillStyle = document.documentElement.dataset.theme === "light"
      ? `rgba(250,247,255,${fade})`
      : `rgba(7,7,16,${fade})`;
    ctx.fillRect(0, 0, w, h);

    const centerX = w * 0.5;
    const centerY = h * 0.5;
    for (const a of agents) {
      const dx = centerX - a.x;
      const dy = centerY - a.y;
      const dist = Math.hypot(dx, dy) + 0.001;
      const pull = (0.002 + 0.006 * wacky) / dist;
      const swirl = 0.03 + 0.08 * wacky;
      const nx = -dy / dist;
      const ny = dx / dist;
      a.vx += dx * pull + nx * swirl * Math.sin(a.phase + tm * 2.3);
      a.vy += dy * pull + ny * swirl * Math.cos(a.phase - tm * 1.8);
      a.vx *= 0.985;
      a.vy *= 0.985;
      const px = a.x;
      const py = a.y;
      a.x += a.vx;
      a.y += a.vy;
      if (a.x < 0 || a.x > w) a.vx *= -1;
      if (a.y < 0 || a.y > h) a.vy *= -1;
      a.x = Math.max(0, Math.min(w, a.x));
      a.y = Math.max(0, Math.min(h, a.y));
      a.phase += 0.02 + Math.abs(a.vx + a.vy) * 0.01;
      const hue = (a.hue + tm * 60 + (a.x / w) * 90) % 360;
      ctx.strokeStyle = `hsla(${hue}, 96%, 64%, ${0.18 + wacky * 0.26})`;
      ctx.lineWidth = 0.8 + wacky * 1.9;
      ctx.beginPath();
      ctx.moveTo(px, py);
      ctx.lineTo(a.x, a.y);
      ctx.stroke();
    }
    requestAnimationFrame(frame);
  }

  document.getElementById("wacky").addEventListener("input", e => {
    wacky = Number(e.target.value) / 100;
  });
  addEventListener("resize", resize);
  resize();
  frame();
})();
</script>
</body>
</html>
